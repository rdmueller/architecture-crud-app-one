name: Publish Documentation

on:
  push:
    branches: 
      - main
    paths:
      - 'docs/**'
      - 'docToolchainConfig.groovy'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          
      - name: Generate architecture JSON from Python files
        run: |
          cd docs/arc42
          # Add any script here to generate architecture.json from your Python models if needed
          
      - name: Build documentation with docToolchain
        run: |
          # Run docToolchain to generate the microsite
          docker run --rm -u 1001:1001 \
            -v ${PWD}:/docToolchain/project \
            -w /docToolchain/project \
            doctoolchain/doctoolchain:v2.0.0 \
            generateHTML generateMicrosite
            
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/microsite

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
